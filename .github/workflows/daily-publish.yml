name: Publish & keep the Act up to date

# Automatic bulk publishing + daily amendment checks. You can still run it manually from Actions.
on:
  push:
    paths:
      - ".github/workflows/daily-publish.yml"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Put previously failed sections/study-guides back in the queue?"
        type: boolean
        default: false
      reseed:
        description: "Rebuild the queue from the official PDF and refresh deterministic titles?"
        type: boolean
        default: false
      batch_limit:
        description: "Maximum number of AI-authored sections to process in this run"
        type: string
        default: "20"
      study_guides:
        description: "Generate MCQ/mnemonic study guides too (automatic; this switch is retained for compatibility)."
        type: boolean
        default: true
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST daily: continue publishing until the queue is empty

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-provisions
  cancel-in-progress: true

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: "gemini-3.8-flash"
      GEMINI_STUDY_MODEL: "gemini-3.8-flash"
      GEMINI_COMMENTARY_MODEL: "gemini-3.8-flash"
      GEMINI_GROUNDING: "true"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      SITE_URL: ${{ vars.SITE_URL }}
      # Always retry previously failed sections; transient AI quota/rate-limit failures must not strand sections permanently.
      RETRY_FAILED: "1"
      TIME_BUDGET_MIN: "150"
      COMMIT_EVERY: "10"
      SLEEP_MS: ${{ vars.SLEEP_MS || '400' }}
      CONCURRENCY: ${{ vars.STUDY_CONCURRENCY || '4' }}
      BATCH_LIMIT: ${{ inputs.batch_limit || '20' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          npm ci

      - name: 1. Load the Act (first run) or check for amendments (later runs)
        id: amend
        run: |
          SOURCE_COUNT=$(git ls-files 'content/source/itax2025-s*.txt' | wc -l)
          echo "Tracked Act section source files: $SOURCE_COUNT"
          if [ "${{ inputs.reseed }}" = "true" ] || [ -f content/.force-reseed ]; then
            FORCE_SOURCE=1 node scripts/seed-queue.mjs
            rm -f content/.force-reseed
          elif [ "$SOURCE_COUNT" -lt 500 ]; then
            echo "Source library is incomplete ($SOURCE_COUNT files); attempting official reseed."
            FORCE_SOURCE=1 node scripts/seed-queue.mjs
          else
            echo "Using the validated section-source library already stored in the repository; no unnecessary download."
            node scripts/check-amendments.mjs
          fi
          git config user.name "itax-automation"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "content: Act data / amendment check $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "Push race; retrying..."
              sleep 2
            done
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

      - name: 2. Generate and publish Section-4-style articles
        env:
          TIME_BUDGET_MIN: "150"
          BATCH_LIMIT: ${{ inputs.batch_limit || '20' }}
        run: node scripts/run-batch.mjs

      - name: 3. Generate practice layer (MCQs, examples and mnemonics)
        env:
          TIME_BUDGET_MIN: "150"
          BATCH_LIMIT: ${{ inputs.batch_limit || '20' }}
        run: node scripts/run-study-batch.mjs

      - name: 4. Site build check
        run: npm run build

      - name: 5. Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name itax-2025 --branch main

      - name: 5b. Cloudflare deployment configuration check
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Cloudflare deployment secrets are not configured; GitHub built the site but did not deploy it."

      - name: 6. Verify content completeness
        run: |
          node -e 'const fs=require("fs"),p=require("path"),q=require("./content/sections.json"); const pub=q.items.filter(x=>x.status==="published"), ma=pub.filter(x=>!fs.existsSync(p.join("content/articles",x.slug+".md"))), ms=pub.filter(x=>!fs.existsSync(p.join("content/study",x.id+".json"))), src=q.items.filter(x=>!fs.existsSync(p.join("content/source",x.id+".txt"))); console.log("Queue: published="+pub.length+", pending="+q.items.filter(x=>x.status==="pending").length+", failed="+q.items.filter(x=>x.status==="failed").length); console.log("AI articles missing for published sections: "+ma.length); console.log("Study guides missing (still being generated): "+ms.length); console.log("Official source files missing: "+src.length); if(ma.length||src.length) process.exit(1);'
