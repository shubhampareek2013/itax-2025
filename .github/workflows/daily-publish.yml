name: Publish & keep the Act up to date

# No fixed schedule for the initial bulk load — start it yourself:
# Actions tab -> "Publish & keep the Act up to date" -> Run workflow.
# Once the site is fully loaded, switch on the schedule below (uncomment it) so the
# daily amendment check runs by itself; the bulk-load jobs will simply find nothing
# left to do and exit in a few seconds.
on:
  push:
    paths:
      - ".github/workflows/daily-publish.yml"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Put previously failed sections/study-guides back in the queue?"
        type: boolean
        default: false
      reseed:
        description: "Rebuild the queue from the official PDF and refresh deterministic titles?"
        type: boolean
        default: false
      batch_limit:
        description: "Maximum number of AI-authored sections to process in this run"
        type: string
        default: "1"
      study_guides:
        description: "Also generate optional MCQ/mnemonic study guides after publishing?"
        type: boolean
        default: false
  # schedule:
  #   - cron: "30 2 * * *"   # 08:00 IST daily amendment check, once bulk loading is done

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-provisions
  cancel-in-progress: true

jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_STUDY_MODEL: ${{ vars.GEMINI_STUDY_MODEL || 'gemini-2.5-pro' }}
      GEMINI_COMMENTARY_MODEL: ${{ vars.GEMINI_COMMENTARY_MODEL || 'gemini-2.5-pro' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      SITE_URL: ${{ vars.SITE_URL }}
      RETRY_FAILED: ${{ inputs.retry_failed && '1' || '0' }}
      TIME_BUDGET_MIN: "150"
      COMMIT_EVERY: "10"
      SLEEP_MS: ${{ vars.SLEEP_MS || '400' }}
      CONCURRENCY: ${{ vars.STUDY_CONCURRENCY || '4' }}
      BATCH_LIMIT: ${{ inputs.batch_limit || '1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          npm ci

      - name: 1. Load the Act (first run) or check for amendments (later runs)
        id: amend
        run: |
          SOURCE_COUNT=$(find content/source -maxdepth 1 -type f -name "itax2025-s*.txt" 2>/dev/null | wc -l)
          if [ "${{ inputs.reseed }}" = "true" ] || [ "$SOURCE_COUNT" -lt 500 ] || [ -f content/.force-reseed ]; then
            FORCE_SOURCE=1 node scripts/seed-queue.mjs
            rm -f content/.force-reseed
          else
            node scripts/check-amendments.mjs
          fi
          git config user.name "itax-automation"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || (git commit -m "content: Act data / amendment check $(date -u +%F)" && git push)

      - name: 2. Generate and publish Section-4-style articles
        env:
          TIME_BUDGET_MIN: "150"
          BATCH_LIMIT: ${{ inputs.batch_limit || '1' }}
        run: node scripts/run-batch.mjs

      - name: 3. Optional practice layer (MCQs and mnemonics)
        if: inputs.study_guides == true
        env:
          TIME_BUDGET_MIN: "150"
        run: node scripts/run-study-batch.mjs

      - name: 4. Site build check
        run: npm run build

      - name: 5. Do not self-trigger another run
        if: steps.amend.outcome == 'success'
        run: echo "Automatic continuation disabled; run manually when you want to continue."
